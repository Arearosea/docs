<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مُصلّي - تطبيق الصلاة المتكامل</title>
    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <!-- Styles -->
    <style>
        :root {
            --primary: #8B4513;
            --secondary: #F5F5DC;
            --text: #3E2723;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: var(--secondary);
            color: var(--text);
            transition: 0.3s;
        }

        .dark-mode {
            background: #2c2c2c;
            color: #fff;
        }

        header {
            background: var(--primary);
            color: white;
            padding: 1rem;
            text-align: center;
        }

        .prayer-times {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1rem;
            padding: 1rem;
        }

        .prayer-card {
            background: white;
            border-radius: 10px;
            padding: 1rem;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            text-align: center;
        }

        .active-prayer {
            border: 2px solid var(--primary);
        }

        /* إضافة المزيد من الأنماط هنا */
    </style>
</head>
<body>
    <header>
        <h1>مُصلّي ✨</h1>
        <button id="themeToggle">تبديل الوضع</button>
    </header>

    <main>
        <!-- واجهة أوقات الصلاة -->
        <section class="prayer-times" id="prayerTimes"></section>

        <!-- واجهة الأذكار -->
        <section class="azkar-section">
            <h2>أذكار الصباح والمساء</h2>
            <div id="azkarContent"></div>
        </section>

        <!-- باقي العناصر -->
    </main>

<script>
// Firebase configuration
const firebaseConfig = {
    apiKey: "YOUR_API_KEY",
    authDomain: "YOUR_AUTH_DOMAIN",
    projectId: "YOUR_PROJECT_ID",
    storageBucket: "YOUR_STORAGE_BUCKET",
    messagingSenderId: "YOUR_SENDER_ID",
    appId: "YOUR_APP_ID"
};

// Initialize Firebase
firebase.initializeApp(firebaseConfig);

// بيانات التطبيق
const data = {
    encouragingMessages: [
        "بارك الله فيك يا إبراهيم، استمر في هذا الأجر العظيم!",
        "لقد أضفت نوراً إلى يومك بصلاة جميلة!",
        "الله يرفع قدرك ويجعل صلاتك في ميزان حسناتك"
    ],
    
    azkar: [
        {text: "سبحان الله وبحمده سبحان الله العظيم", count: 100},
        {text: "لا إله إلا الله وحده لا شريك له", count: 100}
    ],

    prayerTimes: {
        method: 5, // طريقة الحساب لمصر
        city: "Cairo",
        country: "Egypt"
    }
};

// وظائف التطبيق
class PrayerApp {
    constructor() {
        this.init();
    }

    async init() {
        await this.loadPrayerTimes();
        this.setupReminders();
        this.renderAzkar();
        this.setupTheme();
    }

    async loadPrayerTimes() {
        const response = await fetch(`https://api.aladhan.com/v1/timingsByCity?city=${data.prayerTimes.city}&country=${data.prayerTimes.country}&method=${data.prayerTimes.method}`);
        const result = await response.json();
        this.displayPrayerTimes(result.data.timings);
    }

    displayPrayerTimes(timings) {
        const prayers = ['Fajr', 'Dhuhr', 'Asr', 'Maghrib', 'Isha'];
        const container = document.getElementById('prayerTimes');
        
        prayers.forEach(prayer => {
            const card = document.createElement('div');
            card.className = 'prayer-card';
            card.innerHTML = `
                <h3>${this.getPrayerName(prayer)}</h3>
                <p>${timings[prayer]}</p>
            `;
            container.appendChild(card);
        });
    }

    getPrayerName(englishName) {
        const names = {
            Fajr: 'الفجر',
            Dhuhr: 'الظهر',
            Asr: 'العصر',
            Maghrib: 'المغرب',
            Isha: 'العشاء'
        };
        return names[englishName];
    }

    setupReminders() {
        // تنبيه قبل الصلاة بـ 15 دقيقة
        setInterval(() => {
            // منطق التحقق من المواعيد
        }, 60000);
    }

    renderAzkar() {
        const azkarContainer = document.getElementById('azkarContent');
        data.azkar.forEach(zikr => {
            const zikrElement = document.createElement('div');
            zikrElement.className = 'zikr-card';
            zikrElement.innerHTML = `
                <p>${zikr.text}</p>
                <small>عدد التكرار: ${zikr.count}</small>
            `;
            azkarContainer.appendChild(zikrElement);
        });
    }

    setupTheme() {
        const themeToggle = document.getElementById('themeToggle');
        themeToggle.addEventListener('click', () => {
            document.body.classList.toggle('dark-mode');
        });
    }

    // باقي الوظائف
}

// بدء التطبيق
const app = new PrayerApp();

// إضافة خدمة تحديد الموقع
navigator.geolocation.getCurrentPosition(position => {
    console.log('الموقع:', position.coords);
    // تحديث اتجاه القبلة بناء على الموقع
});

// إضافة وظائف تسجيل الدخول
const authProviders = {
    google: new firebase.auth.GoogleAuthProvider(),
    facebook: new firebase.auth.FacebookAuthProvider()
};
</script>

<!-- محتوى سورة الكهف -->
<section id="surahKahf" style="display: none;">
    <!-- النص الكامل للسورة -->
</section>

<!-- التسبيح -->
<div class="tasbeeh-widget">
    <button onclick="incrementTasbeeh()">سبحان الله</button>
    <span id="counter">0</span>
    <button onclick="resetCounter()">إعادة</button>
</div>

<script>
// وظيفة التسبيح
let count = 0;
function incrementTasbeeh() {
    count++;
    document.getElementById('counter').textContent = count;
}

function resetCounter() {
    count = 0;
    document.getElementById('counter').textContent = count;
}

// إضافة القرآن الكريم
const quranAudio = new Audio('https://server8.mp3quran.net/afs/001.mp3');
</script>

</body>
  </html>
